<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MergePDF - PDF Merger</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>MergePDF</h1>

        <p class="subtitle">
            Merge multiple PDF files into one PDF
        </p>

        <!-- Upload Area -->
        <div class="upload-box"
             onclick="document.getElementById('pdfFiles').click()">

            <p>📄 Select PDF files to merge</p>

            <label for="pdfFiles"
                   class="choose-btn"
                   onclick="event.stopPropagation()">
                Choose PDF Files
            </label>

            <input
                type="file"
                id="pdfFiles"
                accept=".pdf,application/pdf"
                multiple
            >

        </div>

        <!-- Selected Files -->
        <div class="file-section">

            <h3>Selected Files</h3>

            <ul id="fileList"></ul>

        </div>

        <!-- Merge Button -->
        <button
            id="mergeBtn"
            class="merge-btn"
            disabled>
            Merge PDFs
        </button>

        <!-- Status -->
        <div id="status"></div>

        <!-- Download -->
        <div id="downloadLink">

            <a id="downloadBtn" href="#">
                Download Merged PDF
            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
